<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Restration Form</title>
</head>
<body bgcolor="MistyRose">   
    <form>
        <table align="center" width="700"cellpadding="10">  

            <tr>
                <td colspan="2" align="center">
                    <h1>Student Restration Form </h1>
                </td>
            </tr>

              <tr>
            <td>Rollno. :</td>
            <td><input type="text" size ="50"/></td>
         </tr>
             
            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" size="21" placeholder="First Name"/>
                    <input type="text" size="21"placeholder="Last Name"/>
                </td>
            </tr>

            <tr>
                <td>Father's Name :</td>
                <td><input type="text" size="50"/></td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input type="text" size="3"placeholder="Day"/>
                    <input type="text" size="3"placeholder="Month"/>
                    <input type="text" size="3" placeholder="Year"/>
                    <i>(DD-MM-YYYY)</i>
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" size="1" value="+91"/>
                    <input type="text" size="42"/>             
                </td>
            </tr>

            <tr>
                <td>Email Id :</td>
                <td><input type="text" size="50"/></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" size="50"/></td>
            </tr>
           
            <tr>
                <td>Gender :</td>
                <td><input type="radio" name="g"/>Male
                    <input type="radio"name="g"/>Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"/>CSE
                    <input type="checkbox"/>IT
                    <input type="checkbox"/>ECE
                    <input type="checkbox"/>Civil
                    <input type="checkbox"/>Mach
                </td>
            </tr>
          
            <tr>
                <td>Course :</td>
                <td> 
                <select>
                    <option>------------------Select Course
                     Course's ----------------- </option>
                     <option>C</option>
                     <option>C++</option>
                     <option>Java</option>
                     <option>JavaScript</option>
                     <option>React</option>
                </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td><input type="file"/></td>
            </tr>

            <tr>
                <td>City :</td>
                <td><input type="text" size="50"/></td>
            </tr>

            <tr>
                <td>Address :</td>
                  <td> <textarea cols = "48" rows ="5" ></textarea></td>

            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value = "Register"/>
                </td>
            </tr>
     </table>
    </form> 
</body>
</html>
